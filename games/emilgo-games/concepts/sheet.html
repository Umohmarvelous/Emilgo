<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#111;font:600 14px Inter,system-ui,sans-serif;color:#fff}
.g{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:6px;padding:6px}
figure{margin:0;position:relative}img{width:100%;display:block}
figcaption{position:absolute;left:8px;top:6px;background:#000a;padding:2px 6px;border-radius:4px}
</style></head><body><div class="g" id="g"></div><script>
const q=new URLSearchParams(location.search);const g=document.getElementById('g');
g.style.setProperty('--c',q.get('c')||3);let n=0;const list=(q.get('i')||'').split(',').filter(Boolean);
for(const i of list){const f=document.createElement('figure');const im=new Image();im.src='img/'+i+'.jpg';im.onload=im.onerror=()=>{if(++n===list.length)window.__done={ok:true}};f.append(im);const c=document.createElement('figcaption');c.textContent=i;f.append(c);g.append(f);}
</script></body></html>
