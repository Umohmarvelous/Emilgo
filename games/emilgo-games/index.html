<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050607" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Free For All across Naija World and Dead Streets in Spooky World: play online with friends, right in the browser." />
    <title>Blackmask · EMILGO Games</title>
    <!-- v5 (3.9): the name and the icon (dev/icon.mjs); a phone's home screen uses them. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Blackmask" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Vatar Games SDK, served by Lagos Life — never a copy (docs, Quick start 01).
         `async`: a slow network must not hold the game back. The game waits for
         it only when it is actually framed by a world. Stripped from the EMILGO build. -->
    <script async src="https://lagoslife.app/sdk/vatar-games-v1.js"></script>
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #050607; }
      /* Welcome: full-screen hero art, the wordmark, a thin green bar. */
      #boot {
        position: fixed; inset: 0; z-index: 10; overflow: hidden; color: #fff;
        background: #050607 radial-gradient(ellipse at 50% 60%, #1e3a2a 0%, #0a120e 55%, #050607 100%);
        font: 500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.45s;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      /* v4 Welcome A: this week's place full-bleed (the game's own shot), the wordmark on the left, two modes, a thin amber bar. */
      #boot .art { position: absolute; inset: 0; background: center 40% / cover no-repeat; opacity: 0; transform: scale(1.06); transition: opacity 0.8s, transform 6s ease-out; filter: brightness(0.9); }
      #boot .art.in { opacity: 1; transform: scale(1); }
      #boot .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 45%), linear-gradient(90deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 55%); }
      #boot .logo { position: absolute; left: calc(34px + env(safe-area-inset-left, 0px)); top: 26%; line-height: 1; animation: bootrise 0.8s ease-out both; }
      #boot .logo .e { font: 800 12px Montserrat, "Arial Black", sans-serif; letter-spacing: 0.5em; color: #f5a623; }
      #boot .logo .g { font: 900 min(52px, 10.5vw) Montserrat, "Arial Black", Impact, sans-serif; letter-spacing: 0.02em; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
      #boot .logo .tag { font: 600 10px system-ui, sans-serif; letter-spacing: 0.14em; opacity: 0.85; margin-top: 8px; }
      #boot .logo .chips { display: flex; gap: 6px; margin-top: 14px; }
      #boot .logo .chips span { font: 800 8px system-ui, sans-serif; letter-spacing: 0.08em; padding: 4px 8px; border: 1px solid rgba(255,255,255,.55); }
      #boot .logo .chips span.ds { border-color: #ff5a4a; color: #ff8a7a; }
      #boot .drop { position: absolute; right: calc(34px + env(safe-area-inset-right, 0px)); top: 22px; text-align: right; font: 800 10px system-ui, sans-serif; letter-spacing: 0.3em; color: #ffb53a; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
      #boot .drop b { display: block; font: 900 18px Montserrat, "Arial Black", sans-serif; letter-spacing: 0.02em; color: #fff; margin-top: 3px; }
      #boot .bar { position: absolute; left: calc(34px + env(safe-area-inset-left, 0px)); right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); height: 2px; background: rgba(255,255,255,.15); }
      #boot .bar i { display: block; height: 100%; width: 8%; background: #f5a623; box-shadow: 0 0 10px #f5a623; transition: width 0.3s; }
      #boot .txt { position: absolute; left: calc(34px + env(safe-area-inset-left, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); letter-spacing: 0.3em; text-transform: uppercase; font: 800 9px system-ui, sans-serif; opacity: 0.9; }
      #boot .ver { position: absolute; right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); font: 600 8px system-ui, sans-serif; letter-spacing: 0.12em; opacity: 0.6; text-transform: uppercase; }
      @keyframes bootrise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .boot-fail { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); max-width: 300px; text-align: center; }
      .boot-fail b { font-size: 14px; }
      .boot-fail p { opacity: 0.85; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="art" id="boot-art"></div>
      <div class="shade"></div>
      <div class="logo" aria-label="Blackmask, by EMILGO Games">
        <div class="e">EMILGO</div>
        <div class="g">BLACKMASK</div>
        <div class="tag">SURVIVE THE NIGHT · OWN THE STREETS</div>
        <div class="chips"><span>FREE FOR ALL</span><span class="ds">DEAD STREETS</span></div>
      </div>
      <div class="drop" id="boot-drop"></div>
      <div class="bar"><i id="boot-fill"></i></div>
      <div class="txt" id="boot-text">Loading Lagos...</div>
      <div class="ver">v4 · Max Mode</div>
    </div>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
